
{% extends 'aposts/index.html' %}
{% load static %}
{% block content %}
<section class="py-2">
    <div class="container px-5">
        <div class="row px-5 justify-content-center">
            <!-- Card -->
            {% for post in object_list %}
            <div class="col-lg-4 mb-5">

                <div class="card h-100 shadow border-0 position-relative overflow-hidden">
                        {% if post.image %}
                            <img class="card-img-top post-img" src="{{ post.image.url }}" alt="{{ post.title }}" />                             
                        {% else %}
                            <img class="card-img-top post-img" src="{% static 'images/man-using.jpg' %}"/>
                        {% endif %}
                        <a class="text-decoration-none link-dark stretched-link" href="{% url 'publicacion_detail' pk=post.pk %}"></a>

                        <!-- Overlay + usuario -->
                        <div class="overlay d-flex align-items-end justify-content-start p-3">
                            <div class="d-flex align-items-center text-white">

                                <img class="rounded-circle me-2" src="{{ post.user.profile.avatar.url }}" alt="Avatar" width="40" height="40" style="object-fit: cover;"/>
                                
                                <div class="small fw-bold">{{ post.user }}</div>
                            </div>
                        </div>
                </div>

            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
