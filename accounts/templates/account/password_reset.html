{% block content %}
<div class="dark-mode rounded-3 py-5 px-4 px-md-5 mb-5">
    <div class="text-center mb-5">
        <h1 class="fw-bolder">Recuperar contraseña</h1>
        <p>Ingresá el correo con el que te registraste y te enviaremos un enlace para restablecerla.</p>
    </div>

    <div class="row gx-5 justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <form method="post">
                {% csrf_token %}

                <!-- Email input -->
                <div class="form-floating mb-3">
                    <input class="form-control {% if form.email.errors %}is-invalid{% endif %}" 
                           id="email" name="email" type="email" placeholder="nombre@ejemplo.com" 
                           value="{{ form.email.value|default_if_none:'' }}">
                    <label for="email">Correo electrónico</label>
                    {% for error in form.email.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                    {% endfor %}
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Enviar enlace</button>
                </div>

                <div class="text-center mt-3">
                    <a class="fw-bolder" href="{% url 'login' %}">Volver a iniciar sesión</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
